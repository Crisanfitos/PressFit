appId: com.crisanfitos.PressFit_Expo
---
# us_031_add_exercise_from_catalog.yaml — US-031: Incorporación de ejercicios desde el catálogo a un día de rutina
- launchApp:
    clearState: true

- tapOn:
    text: ".*8081.*"
    optional: true

# Manejar posible modal de Expo / Dev Menu
- runFlow:
    when:
      visible: ".*developer menu.*"
    commands:
      - back

- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 20000

- tapOn:
    id: "login-button"

- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 10000

- tapOn:
    id: "email-input"

- inputText: ${E2E_TEST_EMAIL}

- tapOn:
    id: "password-input"

- inputText: ${E2E_TEST_PASSWORD}

- hideKeyboard

- tapOn:
    id: "login-submit-button"

- extendedWaitUntil:
    visible:
      id: "monthly-calendar-screen"
    timeout: 15000

# 1. Navegar a Plantillas y al detalle del planificador
- tapOn:
    id: "edit-routine-fab"

- extendedWaitUntil:
    visible:
      id: "routine-editor-screen"
    timeout: 10000

- tapOn:
    id: "edit-routine-detail-button"

- extendedWaitUntil:
    visible:
      id: "routine-detail-screen"
    timeout: 10000

# 2. Seleccionar el día Lunes para abrir el editor de ejercicios del día
- tapOn:
    id: "routine-day-card-lunes"

- extendedWaitUntil:
    visible:
      id: "workout-screen"
    timeout: 10000

# 3. Pulsar en "+ Añadir Ejercicio" o FAB para abrir la biblioteca de ejercicios
- tapOn:
    id: "add-exercise-button"
    optional: true

- tapOn:
    id: "add-exercise-fab"
    optional: true

- extendedWaitUntil:
    visible:
      id: "exercise-library-screen"
    timeout: 10000

# 4. Seleccionar el primer ejercicio visible del catálogo (Ab Wheel Rollout)
- extendedWaitUntil:
    visible:
      text: "Ab Wheel Rollout"
    timeout: 15000

- tapOn:
    text: "Ab Wheel Rollout"

# 5. Pulsar el botón de confirmación en la esquina superior derecha del catálogo
- extendedWaitUntil:
    visible:
      id: "confirm-exercise-selection-button"
    timeout: 5000

- tapOn:
    id: "confirm-exercise-selection-button"

# 6. Aserción de retorno a WorkoutScreen y confirmación de la incorporación de "Ab Wheel Rollout"
- extendedWaitUntil:
    visible:
      id: "workout-screen"
    timeout: 10000

- assertVisible:
    id: "workout-screen"

- assertVisible:
    text: "Ab Wheel Rollout"

# 7. Retorno progresivo al Calendario
- tapOn:
    id: "workout-back-button"

- extendedWaitUntil:
    visible:
      id: "routine-detail-screen"
    timeout: 5000

- tapOn:
    id: "routine-detail-back-button"

- extendedWaitUntil:
    visible:
      id: "routine-editor-screen"
    timeout: 5000

- tapOn:
    id: "routine-editor-back-button"

- extendedWaitUntil:
    visible:
      id: "monthly-calendar-screen"
    timeout: 5000

# 8. Flujo de Cierre de Sesión (Logout)
- tapOn:
    text: "Perfil"

- scrollUntilVisible:
    element:
      id: "logout-button"
    direction: DOWN

- tapOn:
    id: "logout-button"

- extendedWaitUntil:
    visible:
      id: "logout-confirm-button"
    timeout: 5000

- tapOn:
    id: "logout-confirm-button"

- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 10000

- assertVisible:
    id: "welcome-screen"

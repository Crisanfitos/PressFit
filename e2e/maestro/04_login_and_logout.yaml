appId: com.crisanfitos.PressFit_Expo
---
# 04_login_and_logout.yaml — Flujo de Login y Cierre de Sesión (Logout)
# Verfica el ciclo completo de autenticación y deja el estado limpio

- launchApp:
    clearState: true

# If Expo Dev Launcher screen appears, tap on dev server
- tapOn:
    text: ".*8081.*"
    optional: true

# 1. Navegar desde bienvenida a pantalla de Login
- extendedWaitUntil:
    visible:
      id: "login-button"
    timeout: 15000

- tapOn:
    id: "login-button"

# 2. Introducir credenciales de prueba
- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 10000

- tapOn:
    id: "email-input"
- inputText: ${E2E_TEST_EMAIL}

- tapOn:
    id: "password-input"
- inputText: ${E2E_TEST_PASSWORD}

- hideKeyboard

- tapOn:
    id: "login-submit-button"

# 3. Verificar entrada a la app (Calendario Mensual)
- extendedWaitUntil:
    visible:
      id: "monthly-calendar-screen"
    timeout: 15000

# 4. Ir a la pestaña de Perfil
- tapOn: "Perfil"

# 5. Pulsar en Cerrar Sesión
- extendedWaitUntil:
    visible:
      id: "logout-button"
    timeout: 10000

- tapOn:
    id: "logout-button"

# 6. Confirmar el modal de cierre de sesión
- extendedWaitUntil:
    visible:
      id: "logout-confirm-button"
    timeout: 5000

- tapOn:
    id: "logout-confirm-button"

# 7. Verificar retorno exitoso a la pantalla de Bienvenida
- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 10000

appId: com.crisanfitos.PressFit_Expo
---
# us_027_weekly_routines_list.yaml — US-027: Verificación de la pantalla de plantillas de rutinas semanales (RoutineEditorScreen)
- launchApp:
    clearState: true

- tapOn:
    text: ".*8081.*"
    optional: true

# Manejar posible modal de Expo / Dev Menu
- runFlow:
    when:
      visible: ".*developer menu.*"
    commands:
      - back

- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 20000

- tapOn:
    id: "login-button"

- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 10000

- tapOn:
    id: "email-input"

- inputText: ${E2E_TEST_EMAIL}

- tapOn:
    id: "password-input"

- inputText: ${E2E_TEST_PASSWORD}

- hideKeyboard

- tapOn:
    id: "login-submit-button"

- extendedWaitUntil:
    visible:
      id: "monthly-calendar-screen"
    timeout: 15000

# 1. Navegar a la pantalla de edición de plantillas de rutinas mediante el FAB
- tapOn:
    id: "edit-routine-fab"

- extendedWaitUntil:
    visible:
      id: "routine-editor-screen"
    timeout: 10000

# 2. Verificar títulos y badge de la rutina ACTIVA
- assertVisible:
    text: "Mis Plantillas"

- assertVisible:
    text: "ACTIVA"

# 3. Volver al Calendario Mensual mediante la navegación Back
- tapOn:
    id: "routine-editor-back-button"

- extendedWaitUntil:
    visible:
      id: "monthly-calendar-screen"
    timeout: 10000

# 4. Flujo de Cierre de Sesión (Logout)
- tapOn:
    text: "Perfil"

- scrollUntilVisible:
    element:
      id: "logout-button"
    direction: DOWN

- tapOn:
    id: "logout-button"

- extendedWaitUntil:
    visible:
      id: "logout-confirm-button"
    timeout: 5000

- tapOn:
    id: "logout-confirm-button"

- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 10000

- assertVisible:
    id: "welcome-screen"

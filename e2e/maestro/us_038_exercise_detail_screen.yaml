appId: com.crisanfitos.PressFit_Expo
---
# us_038_exercise_detail_screen.yaml — US-038: Verificación de pantalla de detalle (ExerciseDetailScreen)
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: ".*8081.*"
    timeout: 20000

- tapOn:
    text: ".*8081.*"

# Manejar posible modal de Expo / Dev Menu (antes de welcome screen)
- runFlow:
    when:
      visible: ".*developer menu.*"
    commands:
      - back

- tapOn:
    text: "Continue"
    optional: true

# Manejar posible modal de Expo / Dev Menu (después de welcome screen)
- tapOn:
    text: "Continue"
    optional: true

- runFlow:
    when:
      visible: ".*developer menu.*"
    commands:
      - back

- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 40000

- tapOn:
    text: "Continue"
    optional: true

- runFlow:
    when:
      visible: ".*developer menu.*"
    commands:
      - back

- tapOn:
    id: "login-button"

- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 10000

- tapOn:
    id: "email-input"

- inputText: ${E2E_TEST_EMAIL}

- tapOn:
    id: "password-input"

- inputText: ${E2E_TEST_PASSWORD}

- hideKeyboard

- tapOn:
    id: "login-submit-button"

- extendedWaitUntil:
    visible:
      id: "monthly-calendar-screen"
    timeout: 15000

# 1. Abrir menú lateral hamburguesa y navegar al Catálogo de Ejercicios
- tapOn:
    id: "hamburger-button"

- extendedWaitUntil:
    visible:
      id: "side-drawer"
    timeout: 5000

- tapOn:
    id: "drawer-item-0"

- extendedWaitUntil:
    visible:
      id: "exercise-catalog-screen"
    timeout: 10000

# 2. Toque en el primer ejercicio visible de la lista para abrir pantalla de detalle
- tapOn:
    text: ".*Ab Wheel Rollout.*"

- extendedWaitUntil:
    visible:
      id: "exercise-detail-screen"
    timeout: 10000

# 3. Aserciones de visibilidad en pantalla de detalle
- assertVisible:
    id: "exercise-detail-screen"

- assertVisible:
    text: ".*Músculos Involucrados.*"

- assertVisible:
    text: ".*Instrucciones.*"

# 4. Retorno al Catálogo de Ejercicios
- tapOn:
    id: "exercise-detail-back-button"

- extendedWaitUntil:
    visible:
      id: "exercise-catalog-screen"
    timeout: 10000

# 5. Retornar al Calendario Mensual
- tapOn:
    id: "exercise-catalog-back-button"

- extendedWaitUntil:
    visible:
      id: "monthly-calendar-screen"
    timeout: 10000

# 6. Cierre de sesión limpio
- tapOn:
    text: "Perfil"

- scrollUntilVisible:
    element:
      id: "logout-button"
    direction: DOWN

- tapOn:
    id: "logout-button"

- extendedWaitUntil:
    visible:
      id: "logout-confirm-button"
    timeout: 5000

- tapOn:
    id: "logout-confirm-button"

- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 10000

- assertVisible:
    id: "welcome-screen"

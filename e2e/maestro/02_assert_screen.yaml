appId: com.crisanfitos.PressFit_Expo
---
# 02_assert_screen.yaml — Lanza la app y verifica visibilidad de la pantalla de bienvenida (WelcomeScreen)

- launchApp

# If Expo Dev Launcher screen appears, tap on dev server
- tapOn:
    text: ".*8081.*"
    optional: true

# If Expo Developer Menu onboarding modal appears, dismiss it with back button
- runFlow:
    when:
      visible: ".*developer menu.*"
    commands:
      - back

- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 15000

- assertVisible:
    id: "login-button"

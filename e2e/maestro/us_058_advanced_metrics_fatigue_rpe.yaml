appId: com.crisanfitos.PressFit_Expo
---
# us_058_advanced_metrics_fatigue_rpe.yaml — US-058: Visualización e Interacción de Métricas Avanzadas (Fatiga, RPE y 1RM) (PF-292)

- launchApp:
    clearState: true

# Seleccionar servidor Metro de Expo si se muestra la pantalla de desarrollo
- tapOn:
    text: ".*8081.*"
    optional: true

# Manejar posible menú de desarrollador
- runFlow:
    when:
      visible: ".*developer menu.*"
    commands:
      - back

# 1. Espera a que la pantalla de bienvenida esté visible
- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 30000

- assertVisible:
    id: "welcome-screen"

# 2. Iniciar Sesión con usuario de pruebas E2E
- tapOn:
    id: "login-button"

- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 10000

- assertVisible:
    id: "email-input"

- tapOn:
    id: "email-input"

- inputText: ${E2E_TEST_EMAIL}

- tapOn:
    id: "password-input"

- inputText: ${E2E_TEST_PASSWORD}

- hideKeyboard

- tapOn:
    id: "login-submit-button"

# 3. Verificar acceso al calendario mensual
- extendedWaitUntil:
    visible:
      id: "monthly-calendar-screen"
    timeout: 20000

- assertVisible:
    id: "monthly-calendar-screen"

# 4. Navegar a la pestaña Progreso en la barra de navegación inferior
- tapOn: "Progreso"

- extendedWaitUntil:
    visible:
      id: "progress-screen"
    timeout: 10000

- assertVisible:
    id: "progress-screen"

- assertVisible:
    id: "progress-item-weekly"

# 5. Navegar a Progreso Semanal (Fatiga y RPE)
- tapOn:
    id: "progress-item-weekly"

- extendedWaitUntil:
    visible:
      id: "weekly-progress-screen"
    timeout: 15000

- assertVisible:
    id: "weekly-progress-screen"

- assertVisible:
    id: "weekly-progress-back-button"

# Validar elementos de la pantalla semanal y tarjeta de fatiga / estado vacío
- runFlow:
    when:
      visible:
        id: "weekly-progress-summary-card"
    commands:
      - assertVisible:
          id: "weekly-progress-summary-card"

- runFlow:
    when:
      visible:
        id: "fatigue-level-card"
    commands:
      - assertVisible:
          id: "fatigue-level-card"
      - assertVisible:
          id: "fatigue-status-badge"
      - assertVisible:
          id: "rpe-gauge-fill"
      - assertVisible:
          id: "metric-avg-rpe"
      - assertVisible:
          id: "metric-evaluated-sets"
      - assertVisible:
          id: "metric-high-intensity"
      - assertVisible:
          id: "fatigue-recommendation-box"

- runFlow:
    when:
      visible:
        id: "weekly-progress-empty-state"
    commands:
      - assertVisible:
          id: "weekly-progress-empty-state"

- runFlow:
    when:
      visible:
        id: "weekly-progress-chart-container"
    commands:
      - assertVisible:
          id: "weekly-progress-chart-container"

# Volver a la pantalla principal de progreso
- tapOn:
    id: "weekly-progress-back-button"

- extendedWaitUntil:
    visible:
      id: "progress-screen"
    timeout: 10000

- assertVisible:
    id: "progress-screen"

# 6. Navegar a Perfil para verificar Métricas Avanzadas 1RM (PhysicalProgress)
- tapOn: "Perfil"

- scrollUntilVisible:
    element:
      id: "view-physical-progress-button"
    direction: DOWN

- assertVisible:
    id: "view-physical-progress-button"

- tapOn:
    id: "view-physical-progress-button"

- extendedWaitUntil:
    visible:
      id: "physical-progress-screen"
    timeout: 15000

- assertVisible:
    id: "physical-progress-screen"

- assertVisible:
    id: "physical-progress-back-button"

# Verificar tarjeta de métricas avanzadas (AdvancedMetricsCard / 1RM)
- runFlow:
    when:
      visible:
        id: "advanced-metrics-card"
    commands:
      - assertVisible:
          id: "advanced-metrics-card"
      - assertVisible:
          id: "exercise-selector-button"
      - tapOn:
          id: "exercise-selector-button"
      - extendedWaitUntil:
          visible:
            id: "close-exercise-selector"
          timeout: 5000
      - tapOn:
          id: "close-exercise-selector"

- runFlow:
    when:
      visible:
        id: "metric-current-1rm"
    commands:
      - assertVisible:
          id: "metric-current-1rm"
      - assertVisible:
          id: "metric-best-1rm"
      - assertVisible:
          id: "metric-formula"

# Volver a la pantalla de Perfil
- tapOn:
    id: "physical-progress-back-button"

- extendedWaitUntil:
    visible:
      id: "logout-button"
    timeout: 10000

# 7. Cierre de sesión limpio
- scrollUntilVisible:
    element:
      id: "logout-button"
    direction: DOWN

- tapOn:
    id: "logout-button"

- extendedWaitUntil:
    visible:
      id: "logout-confirm-button"
    timeout: 5000

- assertVisible:
    id: "logout-confirm-button"

- tapOn:
    id: "logout-confirm-button"

- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 10000

- assertVisible:
    id: "welcome-screen"

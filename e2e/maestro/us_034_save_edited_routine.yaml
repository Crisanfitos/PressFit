appId: com.crisanfitos.PressFit_Expo
---
# us_034_save_edited_routine.yaml — US-034: Verificación de auto-guardado e instantaneidad en la edición de rutina
- launchApp:
    clearState: true

- tapOn:
    text: ".*8081.*"
    optional: true

# Manejar posible modal de Expo / Dev Menu
- runFlow:
    when:
      visible: ".*developer menu.*"
    commands:
      - back

- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 20000

- tapOn:
    id: "login-button"

- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 10000

- tapOn:
    id: "email-input"

- inputText: ${E2E_TEST_EMAIL}

- tapOn:
    id: "password-input"

- inputText: ${E2E_TEST_PASSWORD}

- hideKeyboard

- tapOn:
    id: "login-submit-button"

- extendedWaitUntil:
    visible:
      id: "monthly-calendar-screen"
    timeout: 15000

# 1. Navegar a Plantillas y al detalle del planificador
- tapOn:
    id: "edit-routine-fab"

- extendedWaitUntil:
    visible:
      id: "routine-editor-screen"
    timeout: 10000

- tapOn:
    id: "edit-routine-button-0"

- extendedWaitUntil:
    visible:
      id: "routine-detail-screen"
    timeout: 10000

# 2. Modificar la descripción del día Lunes
- tapOn:
    id: "edit-day-desc-button-lunes"

- extendedWaitUntil:
    visible:
      id: "edit-day-desc-input"
    timeout: 5000

- tapOn:
    id: "edit-day-desc-input"

- eraseText: 50

- inputText: "Enfoque Fuerza Persistente"

- hideKeyboard

- tapOn:
    id: "save-day-desc-button"

- extendedWaitUntil:
    visible:
      text: ".*Enfoque Fuerza Persistente.*"
    timeout: 5000

- assertVisible:
    text: ".*Enfoque Fuerza Persistente.*"

# 3. Comprobar Auto-Guardado Persistente: Salir de la rutina sin botón guardar global y reingresar
- tapOn:
    id: "routine-detail-back-button"

- extendedWaitUntil:
    visible:
      id: "routine-editor-screen"
    timeout: 10000

- tapOn:
    id: "edit-routine-button-0"

- extendedWaitUntil:
    visible:
      id: "routine-detail-screen"
    timeout: 10000

# 4. Aserción de la permanencia de la modificación tras reingresar
- assertVisible:
    text: ".*Enfoque Fuerza Persistente.*"

# 5. Salir al Calendario
- tapOn:
    id: "routine-detail-back-button"

- extendedWaitUntil:
    visible:
      id: "routine-editor-screen"
    timeout: 10000

- tapOn:
    id: "routine-editor-back-button"

- extendedWaitUntil:
    visible:
      id: "monthly-calendar-screen"
    timeout: 10000

# 6. Cierre de sesión limpio
- tapOn:
    text: "Perfil"

- scrollUntilVisible:
    element:
      id: "logout-button"
    direction: DOWN

- tapOn:
    id: "logout-button"

- extendedWaitUntil:
    visible:
      id: "logout-confirm-button"
    timeout: 5000

- tapOn:
    id: "logout-confirm-button"

- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 10000

- assertVisible:
    id: "welcome-screen"

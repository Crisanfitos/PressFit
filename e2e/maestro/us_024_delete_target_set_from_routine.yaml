appId: com.crisanfitos.PressFit_Expo
---
# us_024_delete_target_set_from_routine.yaml — US-024: Plantilla semanal: Eliminar una serie objetivo de un ejercicio
- launchApp:
    clearState: true

- tapOn:
    text: ".*8081.*"
    optional: true

# Manejar posible modal de Expo / Dev Menu
- runFlow:
    when:
      visible: ".*developer menu.*"
    commands:
      - back

- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 20000

- tapOn:
    id: "login-button"

- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 10000

- tapOn:
    id: "email-input"

- inputText: ${E2E_TEST_EMAIL}

- tapOn:
    id: "password-input"

- inputText: ${E2E_TEST_PASSWORD}

- hideKeyboard

- tapOn:
    id: "login-submit-button"

- extendedWaitUntil:
    visible:
      id: "monthly-calendar-screen"
    timeout: 15000

# 1. Navegar a Editar Rutina Semanal vía FAB
- tapOn:
    id: "edit-routine-fab"

- extendedWaitUntil:
    visible:
      id: "routine-editor-screen"
    timeout: 10000

# 2. Entrar a Editar Detalle de la Plantilla Activa
- tapOn:
    id: "edit-routine-detail-button"

- extendedWaitUntil:
    visible:
      id: "routine-detail-screen"
    timeout: 10000

# 3. Seleccionar el día Lunes
- tapOn:
    id: "routine-day-card-lunes"

- extendedWaitUntil:
    visible:
      id: "exercise-card-0"
    timeout: 10000

# 4. Verificar que existen series iniciales (ej: set-row-2)
- assertVisible:
    id: "set-row-2"

# 5. Tocar el botón Eliminar (X) en la tercera serie
- tapOn:
    id: "delete-set-button-2"

# 6. Confirmar eliminación en el diálogo modal Alert
- extendedWaitUntil:
    visible: "(?i)eliminar"
    timeout: 5000

- tapOn:
    text: "(?i)eliminar"

# 7. Verificar que la serie ha sido eliminada (set-row-2 no visible)
- extendedWaitUntil:
    notVisible:
      id: "set-row-2"
    timeout: 5000

- assertNotVisible:
    id: "set-row-2"

# 8. Regresar limpiamente
- back

- extendedWaitUntil:
    visible:
      id: "routine-detail-screen"
    timeout: 5000

- back

- extendedWaitUntil:
    visible:
      id: "routine-editor-screen"
    timeout: 5000

- back

- extendedWaitUntil:
    visible:
      id: "monthly-calendar-screen"
    timeout: 5000

# 9. Flujo de Cierre de Sesión (Logout)
- tapOn:
    text: "Perfil"

- scrollUntilVisible:
    element:
      id: "logout-button"
    direction: DOWN

- tapOn:
    id: "logout-button"

- extendedWaitUntil:
    visible:
      id: "logout-confirm-button"
    timeout: 5000

- tapOn:
    id: "logout-confirm-button"

- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 10000

- assertVisible:
    id: "welcome-screen"

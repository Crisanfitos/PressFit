appId: com.crisanfitos.PressFit_Expo
---
# us_056_social_sharing.yaml — US-056 / PF-415: Automatización E2E para Compartir Entrenamientos y Progreso en Redes Sociales (Social Sharing)
# TDD Reference: Define la especificación E2E en Maestro para validación del flujo de compartir tarjeta gráfica y disparar el Share Sheet del sistema.

- launchApp:
    clearState: true

- tapOn:
    text: ".*8081.*"
    optional: true

# Manejar posible modal de Expo / Dev Menu
- runFlow:
    when:
      visible: ".*developer menu.*"
    commands:
      - back

# 1. Flujo de Autenticación
- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 20000

- tapOn:
    id: "login-button"

- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 10000

- tapOn:
    id: "email-input"

- inputText: ${E2E_TEST_EMAIL}

- tapOn:
    id: "password-input"

- inputText: ${E2E_TEST_PASSWORD}

- hideKeyboard

- tapOn:
    id: "login-submit-button"

# Si aparece modal de sesión previa residual, descartarla
- runFlow:
    when:
      visible:
        id: "resume-workout-modal"
    commands:
      - tapOn:
          id: "resume-workout-discard-button"
      - tapOn: "Descartar"

# 2. Esperar pantalla del Calendario Mensual
- extendedWaitUntil:
    visible:
      id: "monthly-calendar-screen"
    timeout: 20000

# 3. Navegar a la pestaña de Progreso en la barra inferior
- tapOn:
    id: "tab-progreso"

- extendedWaitUntil:
    visible:
      id: "progress-screen"
    timeout: 15000

# 4. Validar interacción con el botón de compartir de la tarjeta de récord personal (PRGlowCard)
- runFlow:
    when:
      visible:
        id: "progress-pr-glow-card-share-button"
    commands:
      - tapOn:
          id: "progress-pr-glow-card-share-button"
      # Comprobar que no hay crash en el diálogo del sistema y descartarlo
      - runFlow:
          when:
            visible: ".*(Share|Compartir).*"
          commands:
            - back

# 5. Manejar contenedor modal de compartir (ShareModal) si está visible
- runFlow:
    when:
      visible:
        id: "share-modal-container"
    commands:
      - assertVisible:
          id: "share-modal-container"
      - tapOn:
          id: "share-modal-close-btn"

# 6. Flujo de Cierre de Sesión Limpio
- tapOn:
    id: "tab-perfil"

- scrollUntilVisible:
    element:
      id: "logout-button"
    direction: DOWN

- tapOn:
    id: "logout-button"

- assertVisible:
    id: "logout-confirm-button"

- tapOn:
    id: "logout-confirm-button"

- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 15000

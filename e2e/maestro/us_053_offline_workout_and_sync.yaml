appId: com.crisanfitos.PressFit_Expo
---
# us_053_offline_workout_and_sync.yaml — US-053: Ejecución de Entrenamiento en Modo Offline y Sincronización Posterior

- launchApp:
    clearState: true

# If Expo Dev Launcher screen appears, tap on dev server
- tapOn:
    text: ".*8081.*"
    optional: true

# Manejar posible modal de Expo / Dev Menu
- runFlow:
    when:
      visible: ".*developer menu.*"
    commands:
      - back

- tapOn:
    text: "Continue"
    optional: true

- tapOn:
    text: "Continue"
    optional: true

# 1. Navegar desde bienvenida a pantalla de Login
- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 60000

- tapOn:
    text: "Continue"
    optional: true

- tapOn:
    id: "login-button"

# 2. Introducir credenciales de prueba
- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 10000

- tapOn:
    id: "email-input"
- inputText: "${E2E_TEST_EMAIL}"

- tapOn:
    id: "password-input"
- inputText: "${E2E_TEST_PASSWORD}"

- hideKeyboard

- tapOn:
    id: "login-submit-button"

# 3. Verificar entrada a la pantalla principal del Calendario
- extendedWaitUntil:
    visible:
      id: "monthly-calendar-screen"
    timeout: 20000

- assertVisible:
    id: "monthly-calendar-screen"

# 4. Seleccionar el día de hoy para acceder al día de entrenamiento
- tapOn:
    id: "calendar-day-today"
    optional: true

- extendedWaitUntil:
    visible:
      id: "workout-day-screen"
    timeout: 10000
    optional: true

# 5. Iniciar sesión de entrenamiento
- tapOn:
    id: "start-workout-button"
    optional: true

# Descartar alerta si hubiera confirmación o advertencia
- tapOn:
    text: "OK"
    optional: true

- extendedWaitUntil:
    visible:
      id: "workout-screen"
    timeout: 10000
    optional: true

# 6. Activar Modo Avión (Simulación Modo Offline durante el entrenamiento)
# Nota: En emulador/Expo Go se acompaña de optional: true para resiliencia ante RPC reconnect
- toggleAirplaneMode

# 7. Verificar presencia del Banner de Offline si está disponible
- extendedWaitUntil:
    visible:
      id: "offline-banner"
    timeout: 5000
    optional: true

- assertVisible:
    id: "offline-banner"
    optional: true

# 8. Verificar presencia del badge de sincronización en WorkoutHeader
- extendedWaitUntil:
    visible:
      id: "sync-status-badge"
    timeout: 5000
    optional: true

- assertVisible:
    id: "sync-status-badge"
    optional: true

# 9. Desactivar Modo Avión (Restaurar Conectividad Online)
- toggleAirplaneMode

# 10. Retornar del entrenamiento activo hacia la pantalla de detalle del día
- tapOn:
    id: "workout-back-button"
    optional: true

- runFlow:
    when:
      notVisible:
        id: "workout-day-screen"
    commands:
      - back

# 11. Volver al calendario mensual desde el detalle del día
- tapOn:
    id: "workout-day-back-button"
    optional: true

- runFlow:
    when:
      notVisible:
        id: "monthly-calendar-screen"
    commands:
      - back

# Descartar cualquier alerta residual
- tapOn:
    text: "OK"
    optional: true

- extendedWaitUntil:
    visible:
      id: "monthly-calendar-screen"
    timeout: 10000
    optional: true

# 12. Limpieza (Navegar a Perfil y Cierre de Sesión final)
- tapOn: "Perfil"

- scroll
- scrollUntilVisible:
    element:
      id: "logout-button"
    direction: DOWN
    timeout: 10000

- tapOn:
    id: "logout-button"

- extendedWaitUntil:
    visible:
      id: "logout-confirm-button"
    timeout: 5000

- tapOn:
    id: "logout-confirm-button"

- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 10000

- assertVisible:
    id: "welcome-screen"

appId: com.crisanfitos.PressFit_Expo
---
# us_066_toast_system_verification.yaml — US-066: Verificación del Sistema de Toast/Snackbar Unificado

- launchApp:
    clearState: true

# If Expo Dev Launcher screen appears, tap on dev server
- tapOn:
    text: ".*8081.*"
    optional: true

# If Expo Developer Menu onboarding modal appears, dismiss it with back button
- runFlow:
    when:
      visible: ".*developer menu.*"
    commands:
      - back

- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 30000

- tapOn:
    id: "login-button"

- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 10000

- tapOn:
    id: "email-input"
- inputText: "${E2E_TEST_EMAIL}"

- tapOn:
    id: "password-input"
- inputText: "${E2E_TEST_PASSWORD}"

- hideKeyboard

- tapOn:
    id: "login-submit-button"

- extendedWaitUntil:
    visible:
      id: "monthly-calendar-screen"
    timeout: 20000

# 2. Descartar sesión previa si aparece ResumeWorkoutModal
- runFlow:
    when:
      visible:
        id: "resume-workout-modal"
    commands:
      - tapOn:
          id: "resume-workout-discard-button"
      - tapOn: "Descartar"

# 3. Verificar entrada al calendario mensual
- extendedWaitUntil:
    visible:
      id: "monthly-calendar-screen"
    timeout: 15000

- assertVisible:
    id: "monthly-calendar-screen"

# 4. Navegar al día actual y cargar la sesión de entrenamiento
- runFlow:
    when:
      notVisible:
        id: "calendar-day-today"
    commands:
      - tapOn:
          id: "toggle-monthly-view"
          optional: true

- tapOn:
    id: "calendar-day-today"

- extendedWaitUntil:
    visible:
      id: "workout-day-screen"
    timeout: 15000

- runFlow:
    when:
      visible:
        id: "rest-timer-floating-bar"
    commands:
      - tapOn:
          id: "rest-timer-floating-bar-finish"

- tapOn:
    id: "start-workout-button"

- extendedWaitUntil:
    visible:
      id: "workout-screen"
    timeout: 15000

- assertVisible:
    id: "workout-screen"

# 5. Asegurar que haya al menos una serie no completada
- runFlow:
    when:
      notVisible:
        id: "set-uncompleted-icon-.*"
    commands:
      - tapOn:
          id: "add-set-button-0"

# 6. Completar una serie no completada para disparar la notificación Toast
- extendedWaitUntil:
    visible:
      id: "set-uncompleted-icon-.*"
    timeout: 5000

- tapOn:
    id: "set-uncompleted-icon-.*"
    waitToSettleTimeoutMs: 500

# 7. Verificar que el toast unificado aparece con caja y mensaje
- extendedWaitUntil:
    visible:
      id: "toast-box"
    timeout: 5000

- assertVisible:
    id: "toast-message"

# 8. Descartar manualmente el toast tocando el botón de descarte
- assertVisible:
    id: "toast-dismiss-button"

- tapOn:
    id: "toast-dismiss-button"

# 9. Verificar que el toast desaparece tras descartarlo
- extendedWaitUntil:
    notVisible:
      id: "toast-box"
    timeout: 5000

# 10. Salir del entrenamiento y cerrar sesión para limpiar estado
- back

- extendedWaitUntil:
    visible:
      id: "workout-day-screen"
    timeout: 10000

- runFlow:
    when:
      visible:
        id: "rest-timer-floating-bar"
    commands:
      - tapOn:
          id: "rest-timer-floating-bar-finish"

- tapOn:
    id: "workout-day-back-button"

- extendedWaitUntil:
    visible:
      id: "monthly-calendar-screen"
    timeout: 10000

- tapOn: "Perfil"

- scroll
- scrollUntilVisible:
    element:
      id: "logout-button"
    direction: DOWN
    timeout: 10000

- tapOn:
    id: "logout-button"

- extendedWaitUntil:
    visible:
      id: "logout-confirm-button"
    timeout: 5000

- tapOn:
    id: "logout-confirm-button"

- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 10000

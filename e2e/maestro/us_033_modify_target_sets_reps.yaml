appId: com.crisanfitos.PressFit_Expo
---
# us_033_modify_target_sets_reps.yaml — US-033: Modificación de series y repeticiones objetivo predeterminadas
- launchApp:
    clearState: true

- tapOn:
    text: ".*8081.*"
    optional: true

# Manejar posible modal de Expo / Dev Menu
- runFlow:
    when:
      visible: ".*developer menu.*"
    commands:
      - back

- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 20000

- tapOn:
    id: "login-button"

- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 10000

- tapOn:
    id: "email-input"

- inputText: ${E2E_TEST_EMAIL}

- tapOn:
    id: "password-input"

- inputText: ${E2E_TEST_PASSWORD}

- hideKeyboard

- tapOn:
    id: "login-submit-button"

- extendedWaitUntil:
    visible:
      id: "monthly-calendar-screen"
    timeout: 15000

# 1. Navegar a Plantillas y al detalle del planificador
- tapOn:
    id: "edit-routine-fab"

- extendedWaitUntil:
    visible:
      id: "routine-editor-screen"
    timeout: 10000

- tapOn:
    id: "edit-routine-button-0"

- extendedWaitUntil:
    visible:
      id: "routine-detail-screen"
    timeout: 10000

# 2. Seleccionar el día Lunes para editar la rutina
- tapOn:
    id: "routine-day-card-lunes"

- extendedWaitUntil:
    visible:
      id: "workout-screen"
    timeout: 10000

# 3. Asegurar que haya al menos un ejercicio programado
- runFlow:
    when:
      visible:
        id: "add-exercise-button"
    commands:
      - tapOn:
          id: "add-exercise-button"
      - extendedWaitUntil:
          visible:
            id: "exercise-library-screen"
          timeout: 10000
      - tapOn:
          text: ".*Press.*|.*Banca.*|.*Dominadas.*|.*Ab Wheel.*"
          optional: true
      - tapOn:
          id: "confirm-exercise-selection-button"
      - extendedWaitUntil:
          visible:
            id: "workout-screen"
          timeout: 10000

# 4. Asegurar que el ejercicio tenga al menos una serie
- runFlow:
    when:
      visible:
        id: "add-set-button-0"
    commands:
      - tapOn:
          id: "add-set-button-0"

# 5. Modificar valores objetivo (peso y reps) en la primera serie
- extendedWaitUntil:
    visible:
      id: "set-weight-input-0"
    timeout: 10000

- tapOn:
    id: "set-weight-input-0"

- inputText: "85"

- tapOn:
    id: "set-reps-input-0"

- inputText: "12"

- hideKeyboard

# 4. Verificar retorno navegando atrás al detalle de la rutina
- tapOn:
    id: "workout-back-button"

- extendedWaitUntil:
    visible:
      id: "routine-detail-screen"
    timeout: 10000

- tapOn:
    id: "routine-detail-back-button"

- extendedWaitUntil:
    visible:
      id: "routine-editor-screen"
    timeout: 10000

- tapOn:
    id: "routine-editor-back-button"

- extendedWaitUntil:
    visible:
      id: "monthly-calendar-screen"
    timeout: 10000

# 5. Cierre de sesión limpio
- tapOn:
    text: "Perfil"

- scrollUntilVisible:
    element:
      id: "logout-button"
    direction: DOWN

- tapOn:
    id: "logout-button"

- extendedWaitUntil:
    visible:
      id: "logout-confirm-button"
    timeout: 5000

- tapOn:
    id: "logout-confirm-button"

- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 10000

- assertVisible:
    id: "welcome-screen"

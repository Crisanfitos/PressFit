appId: com.crisanfitos.PressFit_Expo
---
# us_020_unmark_completed_set.yaml — US-020: Finalizar entrenamiento y verificar estado "Ver / Editar Entrenamiento"

- launchApp:
    clearState: true

# If Expo Dev Launcher screen appears, tap on dev server
- extendedWaitUntil:
    visible: ".*8081.*"
    timeout: 25000
    optional: true

- tapOn:
    text: ".*8081.*"
    optional: true

# If Expo Developer Menu onboarding modal appears, dismiss it with back button
- runFlow:
    when:
      visible: ".*developer menu.*"
    commands:
      - back

- tapOn:
    text: "Continue"
    optional: true

- runFlow:
    when:
      visible: ".*developer menu.*"
    commands:
      - back

# 1. Navegar desde bienvenida a pantalla de Login
- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 30000

- tapOn:
    id: "login-button"

# 2. Introducir credenciales de prueba
- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 10000

- tapOn:
    id: "email-input"
- inputText: "${E2E_TEST_EMAIL}"

- tapOn:
    id: "password-input"
- inputText: "${E2E_TEST_PASSWORD}"

- hideKeyboard

- tapOn:
    id: "login-submit-button"

# 3. Verificar entrada a la pantalla del Calendario Mensual
- extendedWaitUntil:
    visible:
      id: "monthly-calendar-screen"
    timeout: 15000

- assertVisible:
    id: "monthly-calendar-screen"

# 4. Seleccionar el día de hoy para ir a WorkoutDayScreen
- runFlow:
    when:
      notVisible:
        id: "calendar-day-today"
    commands:
      - tapOn:
          id: "toggle-monthly-view"
          optional: true

- tapOn:
    id: "calendar-day-today"

- extendedWaitUntil:
    visible:
      id: "workout-day-screen"
    timeout: 15000

- assertVisible:
    id: "workout-day-screen"

# 5. Tocar el botón de Iniciar Entrenamiento
- tapOn:
    id: "start-workout-button"

# 6. Verificar la transición y carga de WorkoutScreen
- extendedWaitUntil:
    visible:
      id: "workout-screen"
    timeout: 15000

- assertVisible:
    id: "workout-screen"

# 7. Finalizar entrenamiento (header finish button con fallback a scroll y botón inferior)
- runFlow:
    when:
      visible:
        id: "header-finish-button"
    commands:
      - tapOn:
          id: "header-finish-button"

- runFlow:
    when:
      notVisible:
        id: "header-finish-button"
    commands:
      - scrollUntilVisible:
          element:
            id: "finish-workout-button"
          direction: DOWN
          timeout: 10000
      - tapOn:
          id: "finish-workout-button"

# Confirmar en el modal de alerta ("Finalizar")
- runFlow:
    when:
      visible: "(?i)finalizar"
    commands:
      - tapOn:
          text: "(?i)finalizar"

# Confirmar modal de éxito si aparece ("OK")
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn:
          text: "OK"

# 8. Verificar retorno a WorkoutDayScreen y que el botón indica "Ver / Editar Entrenamiento"
- extendedWaitUntil:
    visible:
      id: "workout-day-screen"
    timeout: 15000

- assertVisible:
    id: "workout-day-screen"

- assertVisible: "(?i)ver / editar entrenamiento"

# 9. Volver al Calendario
- tapOn:
    id: "workout-day-back-button"

- extendedWaitUntil:
    visible:
      id: "monthly-calendar-screen"
    timeout: 10000

# 10. Limpieza (Navegar a Perfil y Cierre de Sesión final)
- tapOn:
    id: "tab-perfil"

- scroll
- scrollUntilVisible:
    element:
      id: "logout-button"
    direction: DOWN
    timeout: 10000

- tapOn:
    id: "logout-button"

- extendedWaitUntil:
    visible:
      id: "logout-confirm-button"
    timeout: 5000

- tapOn:
    id: "logout-confirm-button"

- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 10000

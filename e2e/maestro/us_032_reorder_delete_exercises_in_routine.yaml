appId: com.crisanfitos.PressFit_Expo
---
# us_032_reorder_delete_exercises_in_routine.yaml — US-032: Eliminación de ejercicios en un día de rutina
- launchApp:
    clearState: true

# If Expo Dev Launcher screen appears, tap on dev server
- extendedWaitUntil:
    visible: ".*8081.*"
    timeout: 25000
    optional: true

- tapOn:
    text: ".*8081.*"
    optional: true

# If Expo Developer Menu onboarding modal appears, dismiss it with back button
- runFlow:
    when:
      visible: ".*developer menu.*"
    commands:
      - back

- tapOn:
    text: "Continue"
    optional: true

- runFlow:
    when:
      visible: ".*developer menu.*"
    commands:
      - back

- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 30000

- tapOn:
    id: "login-button"

- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 10000

- tapOn:
    id: "email-input"

- inputText: ${E2E_TEST_EMAIL}

- tapOn:
    id: "password-input"

- inputText: ${E2E_TEST_PASSWORD}

- hideKeyboard

- tapOn:
    id: "login-submit-button"

- extendedWaitUntil:
    visible:
      id: "monthly-calendar-screen"
    timeout: 15000

# 1. Navegar a Plantillas y al detalle del planificador
- tapOn:
    id: "edit-routine-fab"

- extendedWaitUntil:
    visible:
      id: "routine-editor-screen"
    timeout: 10000

- tapOn:
    id: "(edit-routine-detail-button|edit-routine-button-0)"

- extendedWaitUntil:
    visible:
      id: "routine-detail-screen"
    timeout: 10000

# 2. Seleccionar el día Lunes para abrir el editor de ejercicios del día
- tapOn:
    id: "routine-day-card-lunes"

- extendedWaitUntil:
    visible:
      id: "workout-screen"
    timeout: 10000

# 3. Eliminar ejercicios programados dinámicamente si existen
- runFlow:
    when:
      visible:
        id: "delete-exercise-button-0"
    commands:
      - tapOn:
          id: "delete-exercise-button-0"
      - extendedWaitUntil:
          visible: "(?i)eliminar"
          timeout: 5000
      - tapOn:
          text: "(?i)eliminar"

# Eliminar segundo ejercicio si todavía hay alguno en la lista
- runFlow:
    when:
      visible:
        id: "delete-exercise-button-0"
    commands:
      - tapOn:
          id: "delete-exercise-button-0"
      - extendedWaitUntil:
          visible: "(?i)eliminar"
          timeout: 5000
      - tapOn:
          text: "(?i)eliminar"

# 4. Aserción de estado en pantalla (placeholder de día libre o botón de añadir ejercicio)
- extendedWaitUntil:
    visible:
      id: "(add-exercise-button|add-exercise-bottom-button|add-exercise-fab)"
    timeout: 10000

- assertVisible:
    id: "(add-exercise-button|add-exercise-bottom-button|add-exercise-fab)"

# 7. Retorno progresivo al Calendario
- tapOn:
    id: "workout-back-button"

- extendedWaitUntil:
    visible:
      id: "routine-detail-screen"
    timeout: 5000

- tapOn:
    id: "routine-detail-back-button"

- extendedWaitUntil:
    visible:
      id: "routine-editor-screen"
    timeout: 5000

- tapOn:
    id: "routine-editor-back-button"

- extendedWaitUntil:
    visible:
      id: "monthly-calendar-screen"
    timeout: 5000

# 8. Flujo de Cierre de Sesión (Logout)
- tapOn:
    id: "tab-perfil"
    optional: true

- runFlow:
    when:
      notVisible:
        id: "logout-button"
    commands:
      - tapOn: "Perfil"

- scrollUntilVisible:
    element:
      id: "logout-button"
    direction: DOWN

- tapOn:
    id: "logout-button"

- extendedWaitUntil:
    visible:
      id: "logout-confirm-button"
    timeout: 5000

- tapOn:
    id: "logout-confirm-button"

- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 10000

- assertVisible:
    id: "welcome-screen"

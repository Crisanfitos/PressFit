appId: com.crisanfitos.PressFit_Expo
---
# Login Flow — PressFit E2E (Maestro)
# Verifies the email/password login flow, navigation to main screen, and clean logout.

- launchApp:
    clearState: true

# If Expo Dev Launcher screen appears, tap on dev server
- tapOn:
    text: ".*8081.*"
    optional: true

# If Expo Developer Menu modal appears, tap Continue to dismiss
- tapOn:
    text: "Continue"
    optional: true

# 1. Tap login button on Welcome Screen if present
- tapOn:
    id: "login-button"
    optional: true

# 2. Wait for the login screen to load
- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 15000

# 3. Enter credentials
- tapOn:
    id: "email-input"
- inputText: "${E2E_TEST_EMAIL}"

- tapOn:
    id: "password-input"
- inputText: "${E2E_TEST_PASSWORD}"

- hideKeyboard

- tapOn:
    id: "login-submit-button"

# 4. Wait for navigation to the main calendar screen
- extendedWaitUntil:
    visible:
      id: "monthly-calendar-screen"
    timeout: 15000

# 5. Clean Logout: Navigate to Profile, scroll down to the bottom and Sign Out
- tapOn: "Perfil"

- scroll
- scrollUntilVisible:
    element:
      id: "logout-button"
    direction: DOWN
    timeout: 10000

- tapOn:
    id: "logout-button"

- extendedWaitUntil:
    visible:
      id: "logout-confirm-button"
    timeout: 5000

- tapOn:
    id: "logout-confirm-button"

# 6. Verify return to Welcome Screen
- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 10000

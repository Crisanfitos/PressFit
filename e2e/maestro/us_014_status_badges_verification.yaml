appId: com.crisanfitos.PressFit_Expo
---
# us_014_status_badges_verification.yaml — US-014: Verificación de insignias de estado (Completado, Pendiente, Perdido)

- launchApp:
    clearState: true

# If Expo Dev Launcher screen appears, tap on dev server
- tapOn:
    text: ".*8081.*"
    optional: true

# If Expo Developer Menu onboarding modal appears, dismiss it with back button
- runFlow:
    when:
      visible: ".*developer menu.*"
    commands:
      - back

# 1. Navegar desde bienvenida a pantalla de Login
- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 20000

- tapOn:
    id: "login-button"

# 2. Introducir credenciales de prueba
- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 10000

- tapOn:
    id: "email-input"
- inputText: "${E2E_TEST_EMAIL}"

- tapOn:
    id: "password-input"
- inputText: "${E2E_TEST_PASSWORD}"

- hideKeyboard

- tapOn:
    id: "login-submit-button"

# 3. Verificar entrada a la pantalla del Calendario Mensual
- extendedWaitUntil:
    visible:
      id: "monthly-calendar-screen"
    timeout: 15000

- assertVisible:
    id: "monthly-calendar-screen"

# 4. Desplazarse hacia abajo para verificar la Leyenda de Estados
- scroll

- scrollUntilVisible:
    element:
      id: "status-legend"
    direction: DOWN
    timeout: 10000

- assertVisible:
    id: "status-legend"

- assertVisible:
    id: "legend-today"

- assertVisible:
    id: "legend-completed"

- assertVisible:
    id: "legend-in-progress"

- assertVisible:
    id: "legend-missed"

# 5. Navegar a un día del calendario para verificar el desglose diario
- scrollUntilVisible:
    element:
      id: "calendar-day-today"
    direction: UP
    timeout: 10000

- tapOn:
    id: "calendar-day-today"

- extendedWaitUntil:
    visible:
      id: "workout-day-screen"
    timeout: 15000

- assertVisible:
    id: "workout-day-screen"

# 6. Retornar al Calendario Mensual
- tapOn:
    id: "workout-day-back-button"

- extendedWaitUntil:
    visible:
      id: "monthly-calendar-screen"
    timeout: 10000

# 7. Limpieza (Navegar a Perfil y Cierre de Sesión final)
- tapOn: "Perfil"

- scroll
- scrollUntilVisible:
    element:
      id: "logout-button"
    direction: DOWN
    timeout: 10000

- tapOn:
    id: "logout-button"

- extendedWaitUntil:
    visible:
      id: "logout-confirm-button"
    timeout: 5000

- tapOn:
    id: "logout-confirm-button"

- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 10000

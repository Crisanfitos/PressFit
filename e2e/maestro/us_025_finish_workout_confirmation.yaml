appId: com.crisanfitos.PressFit_Expo
---
# us_025_finish_workout_confirmation.yaml — US-025: Finalización del entrenamiento y confirmación modal
- launchApp:
    clearState: true

- tapOn:
    text: ".*8081.*"
    optional: true

# Manejar posible modal de Expo / Dev Menu
- runFlow:
    when:
      visible: ".*developer menu.*"
    commands:
      - back

- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 20000

- tapOn:
    id: "login-button"

- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 10000

- tapOn:
    id: "email-input"

- inputText: ${E2E_TEST_EMAIL}

- tapOn:
    id: "password-input"

- inputText: ${E2E_TEST_PASSWORD}

- hideKeyboard

- tapOn:
    id: "login-submit-button"

- extendedWaitUntil:
    visible:
      id: "monthly-calendar-screen"
    timeout: 15000

# 1. Navegar a WorkoutDayScreen seleccionando hoy en el calendario
- runFlow:
    when:
      notVisible:
        id: "calendar-day-today"
    commands:
      - tapOn:
          id: "toggle-monthly-view"
          optional: true

- tapOn:
    id: "calendar-day-today"

- extendedWaitUntil:
    visible:
      id: "workout-day-screen"
    timeout: 15000

- assertVisible:
    id: "workout-day-screen"

# 2. Si el entrenamiento aún no está completado, iniciarlo y finalizarlo
- runFlow:
    when:
      notVisible: "(?i)ver / editar entrenamiento"
    commands:
      - tapOn:
          id: "start-workout-button"
      - extendedWaitUntil:
          visible:
            id: "workout-screen"
          timeout: 15000
      - runFlow:
          when:
            visible:
              id: "header-finish-button"
          commands:
            - tapOn:
                id: "header-finish-button"
      - runFlow:
          when:
            notVisible: "(?i)finalizar"
          commands:
            - scrollUntilVisible:
                element:
                  id: "finish-workout-button"
                direction: DOWN
                timeout: 10000
                optional: true
            - tapOn:
                id: "finish-workout-button"
                optional: true
      - runFlow:
          when:
            visible: "(?i)finalizar"
          commands:
            - tapOn:
                text: "(?i)finalizar"
      - runFlow:
          when:
            visible: "OK"
          commands:
            - tapOn:
                text: "OK"
      - runFlow:
          when:
            visible:
              id: "share-modal-close-btn"
          commands:
            - tapOn:
                id: "share-modal-close-btn"
      - extendedWaitUntil:
          visible:
            id: "workout-day-screen"
          timeout: 10000

# 3. Verificar retorno a WorkoutDayScreen con estado Completado
- assertVisible:
    id: "workout-day-screen"

- assertVisible: ".*Ver / Editar Entrenamiento.*"

# 4. Regresar al Calendario
- tapOn:
    id: "workout-day-back-button"

- extendedWaitUntil:
    visible:
      id: "monthly-calendar-screen"
    timeout: 10000

# 7. Flujo de Cierre de Sesión (Logout)
- tapOn:
    id: "tab-perfil"

- scrollUntilVisible:
    element:
      id: "logout-button"
    direction: DOWN

- tapOn:
    id: "logout-button"

- extendedWaitUntil:
    visible:
      id: "logout-confirm-button"
    timeout: 5000

- tapOn:
    id: "logout-confirm-button"

- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 10000

- assertVisible:
    id: "welcome-screen"

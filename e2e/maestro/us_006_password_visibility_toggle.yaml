appId: com.crisanfitos.PressFit_Expo
---
# us_006_password_visibility_toggle.yaml — US-006: Alternancia de visibilidad de contraseña en Login y Registro

- launchApp:
    clearState: true

# If Expo Dev Launcher screen appears, tap on dev server
- tapOn:
    text: ".*8081.*"
    optional: true

# If Expo Developer Menu onboarding modal appears, dismiss it with back button
- runFlow:
    when:
      visible: ".*developer menu.*"
    commands:
      - back

# 1. Probar alternancia de contraseña en LoginScreen
- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 15000

- tapOn:
    id: "login-button"

- extendedWaitUntil:
    visible:
      id: "password-input"
    timeout: 10000

- tapOn:
    id: "password-input"
- inputText: "MiClaveSecreta123"

- hideKeyboard

- assertVisible:
    id: "login-password-toggle"

- tapOn:
    id: "login-password-toggle"

# 2. Retornar a bienvenida y probar alternancia en SignUpScreen
- back

- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 10000

- tapOn:
    id: "signup-button"

- extendedWaitUntil:
    visible:
      id: "signup-screen"
    timeout: 10000

- tapOn:
    id: "signup-password-input"
- inputText: "PasswordTest123"

- hideKeyboard

- assertVisible:
    id: "signup-password-toggle"

- tapOn:
    id: "signup-password-toggle"

- tapOn:
    id: "signup-confirmpassword-input"
- inputText: "PasswordTest123"

- hideKeyboard

- assertVisible:
    id: "signup-confirmpassword-toggle"

- tapOn:
    id: "signup-confirmpassword-toggle"

# Retornar a pantalla de bienvenida
- back

- assertVisible:
    id: "welcome-screen"

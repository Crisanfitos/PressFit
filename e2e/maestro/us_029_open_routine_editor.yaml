appId: com.crisanfitos.PressFit_Expo
---
# us_029_open_routine_editor.yaml — US-029: Apertura del detalle del editor de rutinas y días de la semana (RoutineDetailScreen)
- launchApp:
    clearState: true

- tapOn:
    text: ".*8081.*"
    optional: true

# Manejar posible modal de Expo / Dev Menu
- runFlow:
    when:
      visible: ".*developer menu.*"
    commands:
      - back

- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 20000

- tapOn:
    id: "login-button"

- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 10000

- tapOn:
    id: "email-input"

- inputText: ${E2E_TEST_EMAIL}

- tapOn:
    id: "password-input"

- inputText: ${E2E_TEST_PASSWORD}

- hideKeyboard

- tapOn:
    id: "login-submit-button"

- extendedWaitUntil:
    visible:
      id: "monthly-calendar-screen"
    timeout: 15000

# 1. Navegar a la lista de plantillas mediante el FAB
- tapOn:
    id: "edit-routine-fab"

- extendedWaitUntil:
    visible:
      id: "routine-editor-screen"
    timeout: 10000

# 2. Entrar a la edición de detalle de la plantilla
- tapOn:
    id: "edit-routine-detail-button"

- extendedWaitUntil:
    visible:
      id: "routine-detail-screen"
    timeout: 10000

# 3. Verificar sección de Días de la Semana y tarjeta del Lunes
- assertVisible:
    text: "Días de la Semana"

- assertVisible:
    id: "routine-day-card-lunes"

# 4. Volver a la lista de plantillas y luego al Calendario
- tapOn:
    id: "routine-detail-back-button"

- extendedWaitUntil:
    visible:
      id: "routine-editor-screen"
    timeout: 10000

- tapOn:
    id: "routine-editor-back-button"

- extendedWaitUntil:
    visible:
      id: "monthly-calendar-screen"
    timeout: 10000

# 5. Flujo de Cierre de Sesión (Logout)
- tapOn:
    text: "Perfil"

- scrollUntilVisible:
    element:
      id: "logout-button"
    direction: DOWN

- tapOn:
    id: "logout-button"

- extendedWaitUntil:
    visible:
      id: "logout-confirm-button"
    timeout: 5000

- tapOn:
    id: "logout-confirm-button"

- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 10000

- assertVisible:
    id: "welcome-screen"

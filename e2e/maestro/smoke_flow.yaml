appId: com.crisanfitos.PressFit_Expo
---
# Smoke Flow — PressFit E2E (Maestro)
# End-to-end smoke test covering the critical happy path:
#   Login -> Calendar -> Select Day -> Start Workout -> Complete Set -> Finish Workout -> Logout

- launchApp:
    clearState: true

# If Expo Dev Launcher screen appears, tap on dev server
- tapOn:
    text: ".*8081.*"
    optional: true

# ===== STEP 1: LOGIN =====
- tapOn:
    id: "login-button"
    optional: true

- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 15000

- tapOn:
    id: "email-input"
- inputText: "${E2E_TEST_EMAIL}"

- tapOn:
    id: "password-input"
- inputText: "${E2E_TEST_PASSWORD}"

- hideKeyboard

- tapOn:
    id: "login-submit-button"

# ===== STEP 2: VERIFY CALENDAR SCREEN =====
- extendedWaitUntil:
    visible:
      id: "monthly-calendar-screen"
    timeout: 15000

# ===== STEP 3: TAP ON TODAY'S DATE =====
- tapOn:
    id: "calendar-day-today"

# ===== STEP 4: WORKOUT DAY SCREEN =====
- extendedWaitUntil:
    visible:
      id: "workout-day-screen"
    timeout: 10000

# Tap the start/continue workout button
- tapOn:
    id: "start-workout-button"

# ===== STEP 5: WORKOUT SCREEN — COMPLETE A SET =====
- extendedWaitUntil:
    visible:
      id: "workout-screen"
    timeout: 10000

# Tap on the first weight input and enter a value
- tapOn:
    id: "set-input"
    index: 0
- inputText: "50"

- hideKeyboard

# ===== STEP 6: FINISH WORKOUT =====
- tapOn:
    id: "finish-workout-button"

# Confirm the finish dialog (if an Alert is shown)
- tapOn:
    text: "Sí"
    optional: true

# ===== STEP 7: CLEAN LOGOUT =====
- tapOn: "Perfil"

- scrollUntilVisible:
    element:
      id: "logout-button"
    direction: DOWN
    timeout: 10000

- tapOn:
    id: "logout-button"

- extendedWaitUntil:
    visible:
      id: "logout-confirm-button"
    timeout: 5000

- tapOn:
    id: "logout-confirm-button"

# Verify return to Welcome Screen
- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 10000

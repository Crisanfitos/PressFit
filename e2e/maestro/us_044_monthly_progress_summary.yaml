appId: com.crisanfitos.PressFit_Expo
---
# us_044_monthly_progress_summary.yaml — US-044: Consulta del resumen de progreso mensual
- launchApp:
    clearState: true

# If Expo Dev Launcher screen appears, tap on dev server
- extendedWaitUntil:
    visible: ".*8081.*"
    timeout: 25000
    optional: true

- tapOn:
    text: ".*8081.*"
    optional: true

# If Expo Developer Menu onboarding modal appears, dismiss it with back button
- runFlow:
    when:
      visible: ".*developer menu.*"
    commands:
      - back

- tapOn:
    text: "Continue"
    optional: true

- runFlow:
    when:
      visible: ".*developer menu.*"
    commands:
      - back

- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 30000

- tapOn:
    id: "login-button"

- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 10000

- tapOn:
    id: "email-input"

- inputText: ${E2E_TEST_EMAIL}

- tapOn:
    id: "password-input"

- inputText: ${E2E_TEST_PASSWORD}

- hideKeyboard

- tapOn:
    id: "login-submit-button"

- extendedWaitUntil:
    visible:
      id: "monthly-calendar-screen"
    timeout: 15000

# 1. Navegar a la pestaña Progreso
- tapOn:
    id: "tab-progreso"
    optional: true

- runFlow:
    when:
      notVisible:
        id: "progress-screen"
    commands:
      - tapOn:
          text: "Progreso"

- extendedWaitUntil:
    visible:
      id: "progress-screen"
    timeout: 10000

# 2. Verificar que la pantalla de Progreso muestra la opción de Progreso Mensual
- assertVisible:
    id: "progress-item-monthly"

# 3. Navegar a Progreso Mensual
- tapOn:
    id: "progress-item-monthly"

- extendedWaitUntil:
    visible:
      id: "monthly-progress-screen"
    timeout: 10000

# 4. Aserciones de la pantalla de Progreso Mensual
- assertVisible:
    text: "Progreso Mensual"

- assertVisible:
    text: "Entrenamientos"

- assertVisible:
    text: ".*Este mes has entrenado.*"

# 5. Asertar que el mes actual aparece en el selector de mes
- assertVisible:
    text: ".*(Enero|Febrero|Marzo|Abril|Mayo|Junio|Julio|Agosto|Septiembre|Octubre|Noviembre|Diciembre).*202[0-9].*"

# 6. Volver a la pantalla de Progreso
- tapOn:
    id: "monthly-progress-back-button"

- extendedWaitUntil:
    visible:
      id: "progress-screen"
    timeout: 10000

- assertVisible:
    id: "progress-screen"

# 7. Cierre de sesión limpio
- tapOn:
    id: "tab-perfil"
    optional: true

- runFlow:
    when:
      notVisible:
        id: "logout-button"
    commands:
      - tapOn: "Perfil"

- scrollUntilVisible:
    element:
      id: "logout-button"
    direction: DOWN

- tapOn:
    id: "logout-button"

- extendedWaitUntil:
    visible:
      id: "logout-confirm-button"
    timeout: 5000

- tapOn:
    id: "logout-confirm-button"

- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 10000

- assertVisible:
    id: "welcome-screen"

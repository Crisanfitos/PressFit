appId: com.crisanfitos.PressFit_Expo
---
# us_043_language_switch.yaml — US-043: Cambio dinámico de idioma en la pantalla de Perfil y verificación de textos traducidos
- launchApp:
    clearState: true

- tapOn:
    text: ".*8081.*"
    optional: true

# Manejar posible modal de Expo / Dev Menu
- runFlow:
    when:
      visible: ".*developer menu.*"
    commands:
      - back

- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 20000

- tapOn:
    id: "login-button"

- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 10000

- tapOn:
    id: "email-input"

- inputText: ${E2E_TEST_EMAIL}

- tapOn:
    id: "password-input"

- inputText: ${E2E_TEST_PASSWORD}

- hideKeyboard

- tapOn:
    id: "login-submit-button"

- extendedWaitUntil:
    visible:
      id: "monthly-calendar-screen"
    timeout: 15000

# Navegar a la pantalla de Perfil desde la barra de pestañas inferior
- tapOn:
    text: "Perfil"

- extendedWaitUntil:
    visible:
      id: "profile-screen"
    timeout: 10000

# Hacer scroll en el perfil hasta la sección de Apariencia y Configuración de Idioma
- scrollUntilVisible:
    element:
      id: "language-status"
    direction: DOWN

# Verificar que el selector de idioma está presente
- assertVisible:
    id: "language-status"

# Seleccionar idioma Inglés (EN)
- tapOn:
    id: "language-select-en"

# Verificar que las etiquetas visibles de la UI se traducen dinámicamente al Inglés ("English", "Log Out")
- extendedWaitUntil:
    visible:
      text: "English"
    timeout: 5000

- assertVisible:
    text: "Log Out"

# Seleccionar idioma Español (ES)
- tapOn:
    id: "language-select-es"

# Verificar que las etiquetas de la UI vuelven dinámicamente al Español ("Cerrar Sesión")
- extendedWaitUntil:
    visible:
      text: "Cerrar Sesión"
    timeout: 5000

- assertVisible:
    id: "language-status"

# Hacer scroll hasta el botón de Logout
- scrollUntilVisible:
    element:
      id: "logout-button"
    direction: DOWN

# Cerrar sesión limpiamente
- tapOn:
    id: "logout-button"

- extendedWaitUntil:
    visible:
      id: "logout-confirm-button"
    timeout: 5000

- tapOn:
    id: "logout-confirm-button"

- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 10000

appId: com.crisanfitos.PressFit_Expo
---
# us_043_language_switch.yaml — US-043: Inicio en Español, verificación de Auth, Drawer, Plantillas y Catálogo en Español, cambio dinámico a Inglés en Perfil y verificación completa de pantallas en Inglés

- launchApp:
    clearState: true

- tapOn:
    text: ".*8081.*"
    optional: true

# Manejar posible modal de Expo / Dev Menu
- runFlow:
    when:
      visible: ".*developer menu.*"
    commands:
      - back

# 1. Verificación inicial de pantalla de bienvenida en Español
- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 30000

- assertVisible:
    text: "Iniciar Sesión"

- assertVisible:
    text: "Crear Cuenta"

# 2. Navegar a Registro (SignUp) y verificar que todo está en Español
- tapOn:
    id: "signup-button"

- extendedWaitUntil:
    visible:
      id: "signup-screen"
    timeout: 10000

- assertVisible:
    text: "Crear Cuenta"

- assertVisible:
    text: "Únete a PressFit"

- assertVisible:
    text: "Nombre Completo"

- assertVisible:
    text: "Correo Electrónico"

- assertVisible:
    text: "Contraseña"

- assertVisible:
    text: "Confirmar Contraseña"

# Volver a la pantalla de bienvenida
- back

- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 10000

# 3. Navegar a Login y verificar que todo está en Español
- tapOn:
    id: "login-button"

- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 10000

- assertVisible:
    text: "Iniciar Sesión"

- assertVisible:
    text: "Tu Progreso, Tu Poder"

- assertVisible:
    text: "Correo Electrónico"

- assertVisible:
    text: "Contraseña"

- assertVisible:
    text: "Olvidé mi contraseña"

# 4. Iniciar sesión
- tapOn:
    id: "email-input"
- inputText: ${E2E_TEST_EMAIL}

- tapOn:
    id: "password-input"
- inputText: ${E2E_TEST_PASSWORD}

- hideKeyboard

- tapOn:
    id: "login-submit-button"

- extendedWaitUntil:
    visible:
      id: "monthly-calendar-screen"
    timeout: 15000

# 5. Abrir el menú lateral (SideDrawer) en Español y verificar Plantillas y Catálogo
- tapOn:
    id: "hamburger-button"

- extendedWaitUntil:
    visible:
      text: "Plantillas Prémium"
    timeout: 5000

- assertVisible:
    text: "Catálogo de Ejercicios"

# Visitar Plantillas Prémium en Español
- tapOn: "Plantillas Prémium"

- extendedWaitUntil:
    visible:
      text: "Biblioteca de Rutinas"
    timeout: 10000

- tapOn:
    id: "back-button"

- extendedWaitUntil:
    visible:
      id: "monthly-calendar-screen"
    timeout: 10000

# Visitar Catálogo de Ejercicios en Español
- tapOn:
    id: "hamburger-button"

- extendedWaitUntil:
    visible:
      text: "Catálogo de Ejercicios"
    timeout: 5000

- tapOn: "Catálogo de Ejercicios"

- extendedWaitUntil:
    visible:
      id: "exercise-catalog-screen"
    timeout: 10000

- assertVisible:
    text: "Catálogo de Ejercicios"

- tapOn:
    id: "exercise-catalog-back-button"

- extendedWaitUntil:
    visible:
      id: "monthly-calendar-screen"
    timeout: 10000

# 6. Ir a Perfil y cambiar el idioma a Inglés
- tapOn: "Perfil"

- extendedWaitUntil:
    visible:
      id: "profile-screen"
    timeout: 10000

- scrollUntilVisible:
    element:
      id: "language-select-en"
    direction: DOWN

- tapOn:
    id: "language-select-en"

# 7. Aserciones de que Perfil se traduce dinámicamente al Inglés
- extendedWaitUntil:
    visible:
      text: "English"
    timeout: 5000

- assertVisible:
    text: "Log Out"

- assertVisible:
    text: "Appearance & Settings"

# 8. Aserciones de que los nombres de las pestañas están en Inglés
- assertVisible:
    text: "Week"

- assertVisible:
    text: "Progress"

- assertVisible:
    text: "Profile"

# 9. Volver a la pestaña Week para acceder al menú lateral (SideDrawer) en Inglés
- tapOn: "Week"

- extendedWaitUntil:
    visible:
      id: "monthly-calendar-screen"
    timeout: 10000

- tapOn:
    id: "hamburger-button"

- extendedWaitUntil:
    visible:
      text: "Premium Templates"
    timeout: 5000

- assertVisible:
    text: "Exercise Catalog"

# Visitar Premium Templates en Inglés
- tapOn: "Premium Templates"

- extendedWaitUntil:
    visible:
      text: "Routine Library"
    timeout: 10000

- assertVisible:
    text: "Premium Templates"

- tapOn:
    id: "back-button"

- extendedWaitUntil:
    visible:
      id: "monthly-calendar-screen"
    timeout: 10000

# Visitar Exercise Catalog en Inglés
- tapOn:
    id: "hamburger-button"

- extendedWaitUntil:
    visible:
      text: "Exercise Catalog"
    timeout: 5000

- tapOn: "Exercise Catalog"

- extendedWaitUntil:
    visible:
      id: "exercise-catalog-screen"
    timeout: 10000

- assertVisible:
    text: "Exercise Catalog"

- tapOn:
    id: "exercise-catalog-back-button"

- extendedWaitUntil:
    visible:
      id: "monthly-calendar-screen"
    timeout: 10000

# 10. Viajar a la pestaña "Progress" y comprobar apartados en Inglés
- tapOn: "Progress"

- extendedWaitUntil:
    visible:
      id: "progress-screen"
    timeout: 10000

- assertVisible:
    text: "Progress"

- assertVisible:
    text: "Monthly Progress"

- assertVisible:
    text: "Weekly Progress"

# 11. Viajar a la pestaña "Week" y comprobar leyenda en Inglés
- tapOn: "Week"

- extendedWaitUntil:
    visible:
      id: "monthly-calendar-screen"
    timeout: 10000

- assertVisible:
    text: "Today"

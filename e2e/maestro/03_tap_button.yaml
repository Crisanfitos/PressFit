appId: com.crisanfitos.PressFit_Expo
---
# 03_tap_button.yaml — Lanza la app, navega a Login, toca el input de email y escribe texto

- launchApp

# If Expo Dev Launcher screen appears, tap on dev server
- tapOn:
    text: ".*8081.*"
    optional: true

# If Expo Developer Menu onboarding modal appears, dismiss it with back button
- runFlow:
    when:
      visible: ".*developer menu.*"
    commands:
      - back

- extendedWaitUntil:
    visible:
      id: "login-button"
    timeout: 15000

# Tap on "Iniciar Sesión" to open login screen
- tapOn:
    id: "login-button"

- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 10000

- tapOn:
    id: "email-input"

- inputText: "test@pressfit.com"

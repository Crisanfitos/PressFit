appId: com.crisanfitos.PressFit_Expo
---
# us_016_start_workout_session.yaml — US-016: Iniciar entrenamiento desde WorkoutDayScreen y cargar WorkoutScreen

- launchApp:
    clearState: true

# If Expo Dev Launcher screen appears, tap on dev server
- extendedWaitUntil:
    visible: ".*8081.*"
    timeout: 25000
    optional: true

- tapOn:
    text: ".*8081.*"
    optional: true

# If Expo Developer Menu onboarding modal appears, dismiss it with back button
- runFlow:
    when:
      visible: ".*developer menu.*"
    commands:
      - back

- tapOn:
    text: "Continue"
    optional: true

- runFlow:
    when:
      visible: ".*developer menu.*"
    commands:
      - back

# 1. Navegar desde bienvenida a pantalla de Login
- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 30000

- tapOn:
    id: "login-button"

# 2. Introducir credenciales de prueba
- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 10000

- tapOn:
    id: "email-input"
- inputText: "${E2E_TEST_EMAIL}"

- tapOn:
    id: "password-input"
- inputText: "${E2E_TEST_PASSWORD}"

- hideKeyboard

- tapOn:
    id: "login-submit-button"

# 3. Verificar entrada a la pantalla del Calendario Mensual
- extendedWaitUntil:
    visible:
      id: "monthly-calendar-screen"
    timeout: 15000

- assertVisible:
    id: "monthly-calendar-screen"

# 4. Iniciar sesión desde la tarjeta Hero de la pantalla de inicio
- tapOn:
    id: "hero-start-workout-button"

- runFlow:
    when:
      visible:
        id: "workout-day-screen"
    commands:
      - tapOn:
          id: "start-workout-button"

# 5. Verificar la transición y carga de WorkoutScreen
- extendedWaitUntil:
    visible:
      id: "workout-screen"
    timeout: 15000

- assertVisible:
    id: "workout-screen"

# 6. Volver atrás al Calendario
- back

- extendedWaitUntil:
    visible:
      id: "monthly-calendar-screen"
    timeout: 10000
    optional: true

- runFlow:
    when:
      visible:
        id: "workout-day-screen"
    commands:
      - tapOn:
          id: "workout-day-back-button"

- extendedWaitUntil:
    visible:
      id: "monthly-calendar-screen"
    timeout: 10000

# 7. Limpieza (Navegar a Perfil y Cierre de Sesión final)
- tapOn:
    id: "tab-perfil"

- scroll
- scrollUntilVisible:
    element:
      id: "logout-button"
    direction: DOWN
    timeout: 10000

- tapOn:
    id: "logout-button"

- extendedWaitUntil:
    visible:
      id: "logout-confirm-button"
    timeout: 5000

- tapOn:
    id: "logout-confirm-button"

- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 10000

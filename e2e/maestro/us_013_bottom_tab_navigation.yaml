appId: com.crisanfitos.PressFit_Expo
---
# us_013_bottom_tab_navigation.yaml — US-013: Navegación por pestañas inferiores (Semana, Progreso, Perfil)

- launchApp:
    clearState: true

# If Expo Dev Launcher screen appears, tap on dev server
- tapOn:
    text: ".*8081.*"
    optional: true

# If Expo Developer Menu onboarding modal appears, dismiss it with back button
- runFlow:
    when:
      visible: ".*developer menu.*"
    commands:
      - back

# 1. Navegar desde bienvenida a pantalla de Login
- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 20000

- tapOn:
    id: "login-button"

# 2. Introducir credenciales de prueba
- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 10000

- tapOn:
    id: "email-input"
- inputText: "${E2E_TEST_EMAIL}"

- tapOn:
    id: "password-input"
- inputText: "${E2E_TEST_PASSWORD}"

- hideKeyboard

- tapOn:
    id: "login-submit-button"

# 3. Verificar entrada inicial a la pestaña "Semana" (MonthlyCalendarScreen)
- extendedWaitUntil:
    visible:
      id: "monthly-calendar-screen"
    timeout: 15000

- assertVisible:
    id: "monthly-calendar-screen"

# 4. Navegar a pestaña "Progreso"
- tapOn: "Progreso"

- extendedWaitUntil:
    visible:
      id: "progress-screen"
    timeout: 10000

- assertVisible:
    id: "progress-screen"

# 5. Navegar a pestaña "Perfil"
- tapOn: "Perfil"

- extendedWaitUntil:
    visible:
      id: "profile-screen"
    timeout: 10000

- assertVisible:
    id: "profile-screen"

# 6. Regresar a pestaña "Semana"
- tapOn: "Semana"

- extendedWaitUntil:
    visible:
      id: "monthly-calendar-screen"
    timeout: 10000

- assertVisible:
    id: "monthly-calendar-screen"

# 7. Limpieza (Navegar a Perfil y Cierre de Sesión final)
- tapOn: "Perfil"

- scroll
- scrollUntilVisible:
    element:
      id: "logout-button"
    direction: DOWN
    timeout: 10000

- tapOn:
    id: "logout-button"

- extendedWaitUntil:
    visible:
      id: "logout-confirm-button"
    timeout: 5000

- tapOn:
    id: "logout-confirm-button"

- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 10000

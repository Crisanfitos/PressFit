appId: com.crisanfitos.PressFit_Expo
---
# us_048_profile_screen_data_verification.yaml — US-048: Verificación de datos de perfil
- launchApp:
    clearState: true

- tapOn:
    text: ".*8081.*"
    optional: true

# Manejar posible modal de Expo / Dev Menu
- runFlow:
    when:
      visible: ".*developer menu.*"
    commands:
      - back

- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 20000

- tapOn:
    id: "login-button"

- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 10000

- tapOn:
    id: "email-input"

- inputText: ${E2E_TEST_EMAIL}

- tapOn:
    id: "password-input"

- inputText: ${E2E_TEST_PASSWORD}

- hideKeyboard

- tapOn:
    id: "login-submit-button"

- extendedWaitUntil:
    visible:
      id: "monthly-calendar-screen"
    timeout: 15000

# 1. Navegar a Perfil
- tapOn:
    id: "tab-perfil"

- extendedWaitUntil:
    visible:
      id: "profile-screen"
    timeout: 10000

# 2. Aserción de header y datos de usuario
- assertVisible:
    id: "profile-screen"

- assertVisible:
    text: ".*@pressfit.com"

# 3. Aserción de secciones principales
- assertVisible:
    id: "profile-physical-data-card"

- assertVisible:
    id: "profile-appearance-card"

# 4. Desplazarse para ver sección de Fotos y Logout
- scrollUntilVisible:
    element:
      id: "profile-progress-photos-card"
    direction: DOWN

- assertVisible:
    id: "profile-progress-photos-card"

# 5. Cierre de sesión limpio
- scrollUntilVisible:
    element:
      id: "logout-button"
    direction: DOWN

- tapOn:
    id: "logout-button"

- extendedWaitUntil:
    visible:
      id: "logout-confirm-button"
    timeout: 5000

- tapOn:
    id: "logout-confirm-button"

- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 10000

- assertVisible:
    id: "welcome-screen"

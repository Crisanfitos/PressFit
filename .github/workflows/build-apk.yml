name: PressFit APK Build (EAS)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: false
        default: 'preview'
        type: choice
        options:
          - preview
          - production
      platform:
        description: 'Target platform'
        required: false
        default: 'android'
        type: choice
        options:
          - android
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build APK via EAS
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify EXPO_TOKEN Secret
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error title=Missing Secret::El secreto EXPO_TOKEN no está configurado en GitHub Secrets."
            echo "### ❌ Error: EXPO_TOKEN no configurado" >> "$GITHUB_STEP_SUMMARY"
            echo "Para compilar en EAS se requiere configurar el secreto \`EXPO_TOKEN\` en **Settings > Secrets and variables > Actions** del repositorio." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✅ EXPO_TOKEN está configurado."

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Determine build profile
        id: profile
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "eas_profile=${{ github.event.inputs.profile }}" >> "$GITHUB_OUTPUT"
          else
            echo "eas_profile=preview" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK on EAS
        id: eas_build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -o pipefail
          echo "### 🏗️ Starting EAS Build" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Profile:** ${{ steps.profile.outputs.eas_profile }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Trigger:** ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Ref:** ${{ github.ref }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          eas build \
            --platform android \
            --profile ${{ steps.profile.outputs.eas_profile }} \
            --non-interactive 2>&1 | tee build_output.log

          BUILD_URL=$(grep -oE 'https://expo\.dev/accounts/[^ ]+/builds/[0-9a-fA-F-]+' build_output.log | head -1)

          if [ -n "$BUILD_URL" ]; then
            echo "build_url=$BUILD_URL" >> "$GITHUB_OUTPUT"
            echo "### ✅ EAS Build Submitted Successfully" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
            echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Build URL** | [View on Expo]($BUILD_URL) |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Profile** | ${{ steps.profile.outputs.eas_profile }} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Platform** | android |" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> 📲 Once the build completes, download the APK from the [Expo build page]($BUILD_URL)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ✅ EAS Build Dispatched" >> "$GITHUB_STEP_SUMMARY"
            echo "Build command finished. Check [Expo Dashboard](https://expo.dev) for progress." >> "$GITHUB_STEP_SUMMARY"
          fi

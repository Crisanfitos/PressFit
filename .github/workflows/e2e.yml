name: PressFit E2E Tests (Maestro)

on:
  workflow_dispatch:
    inputs:
      flow:
        description: 'Maestro flow to run (leave empty for all flows)'
        required: false
        default: ''

jobs:
  e2e:
    name: Run Maestro E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Build Expo Preview APK
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          npx expo prebuild --platform android --clean
          cd android && ./gradlew assembleDebug
          cd ..

      - name: Run Maestro E2E Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-snapshot-load -gpu swiftshader_indirect
          disable-animations: true
          script: |
            # Install the APK
            adb install android/app/build/outputs/apk/debug/app-debug.apk

            # Wait for app to be ready
            sleep 5

            # Run Maestro tests
            if [ -n "${{ github.event.inputs.flow }}" ]; then
              maestro test "e2e/maestro/${{ github.event.inputs.flow }}"
            else
              maestro test e2e/maestro/
            fi
        env:
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

      - name: Upload Maestro Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-screenshots
          path: ~/.maestro/tests/
          retention-days: 7
